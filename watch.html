<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate"> <!-- stop Chrome auto-translate, we have our own EN/DK -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All locations - Apple Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<div class="watch">
  <div class="watch-screen">

    <header class="watch-top">

    <ul class="watch-list">
      <li><a class="watch-row" href="watch-water.html"><span class="icon"><img src="images/icon-droplet.svg" alt=""></span><span class="name">Water station</span><span class="distance">2 km</span></a></li>
      <li><a class="watch-row" href="watch-toilet.html"><span class="icon"><img src="images/icon-toilet.svg" alt=""></span><span class="name">Toilets</span><span class="distance">1 km</span></a></li>
      <li><a class="watch-row" href="watch-equipment.html"><span class="icon"><img src="images/icon-shoe.svg" alt=""></span><span class="name">Equipment</span><span class="distance">5 km</span></a></li>
      <li><a class="watch-row" href="watch-firstaid.html"><span class="icon"><img src="images/icon-aid.svg" alt=""></span><span class="name">First aid</span><span class="distance">1 km</span></a></li>
    </ul>

  </div>
</div>

<script src="js/lang.js"></script>
<script src="js/watch.js"></script>

</html>
