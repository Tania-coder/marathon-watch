<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate"> <!-- stop Chrome auto-translate, we have our own EN/DK -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First aid - Apple Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/watch.css">
</head>
<body>
<div class="watch">
  <div class="watch-screen">

    <header class="watch-top">
      <a class="watch-back" href="watch.html" aria-label="Back"><span>‹</span>First aid</a>
      <span class="watch-time">10:09</span>
    </header>

    <!-- map: same drawing as the big screen, x and y = place we look at -->
    <div class="watch-map">
      <div class="map-content" style="transform: scale(0.55) translate(-499px, -322px);">
        <img class="map-drawing" src="images/map-equipment.svg" alt="">
        <svg class="route-dash" width="808" height="660" aria-hidden="true">
          <line x1="414" y1="314" x2="584" y2="302"/>
        </svg>
        <div class="you"></div>
        <div class="pin aid-far"><img src="images/icon-aid.svg" alt="First aid"></div>
      </div>
    </div>

    <div class="watch-distance">
      <p class="watch-big">3 km <span>left</span></p>
    </div>
    <a class="watch-button red" href="watch-location.html">Call 112</a>

  </div>
</div>

<script src="js/lang.js"></script>
<script src="js/watch.js"></script>
</body>
</html>
