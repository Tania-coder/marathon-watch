<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate"> <!-- stop Chrome auto-translate, we have our own EN/DK -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wait time - Apple Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/watch.css">
</head>
<body>
<div class="watch">
  <div class="watch-screen">

    <header class="watch-top">
      <a class="watch-back" href="watch-toilet.html" aria-label="Back"><span>‹</span>Wait time</a>
      <span class="watch-time">10:09</span>
    </header>

    <ul class="watch-list">
      <li class="watch-row"><span class="name">Toilet D · 1 km</span><span class="status out">~12 min</span></li>
      <li class="watch-row"><span class="name">Toilet B · 3 km</span><span class="status low">~6 min</span></li>
      <li class="watch-row"><span class="name">Toilet A · 5 km</span><span class="status available">~2 min</span></li>
      <li class="watch-row"><span class="name">Toilet C · 5 km</span><span class="status low">~5 min</span></li>
    </ul>

  </div>
</div>

<script src="js/lang.js"></script>
<script src="js/watch.js"></script>
</body>
</html>
